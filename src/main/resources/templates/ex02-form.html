<!DOCTYPE html>
<html lang="ja" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" th:href="@{/ex02.css}">
</head>
<body>
    <h2>ホテル検索</h2>
    <form  th:action="@{/hotel/result}" method="post">
    <input type="text" name="price">円以下<br>
    <button>検索</button><br>
    </form>

    <table border="1" th:each="hotel : ${hotelList}">
        <tr>
        <th class="kisu">ホテル名</th>
        <td class="kisu" th:text="${hotel.hotelName}"></td>
        </tr>

        <tr>
        <th class="gusu">最寄り駅</th>
        <td class="gusu" th:text="${hotel.nearestStation}"></td>
        </tr>

        <tr>
        <th class="kisu">価格</th>
        <td class="kisu" th:text="${hotel.price}"></td>
        </tr>
    </table>
</body>
</html>
